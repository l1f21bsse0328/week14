name: wf-develop-pr
on:
  pull_request:
  branches:
    - develop
jobs:
  develop-pr-job:
    runs-on: ubuntu-latest
    steps:
      - name: repo checkout
        uses: action/checkout@v4

      - name: Lint HTML and CSS Files
        run: |
          npx htmlhint "**/*.html"
          npx stylelint "**/*.css"

      - name: Build website
        run: |
          npx parcel build "./src/index.html" --dist
          npx stylelint "**/*.css"
